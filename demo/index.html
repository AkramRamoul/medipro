<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Secretary Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #64748b;
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --text-main: #1f2937;
            --text-light: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Login Screen */
        #login-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-body);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-card {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-card h2 {
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--primary);
            font-weight: 700;
        }

        /* Layout */
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 0.5rem;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #eff6ff;
            color: var(--primary);
        }

        .user-info {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Components */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn.secondary {
            background: white;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn.secondary:hover {
            background: var(--bg-body);
        }

        .btn.danger {
            background: var(--danger);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 0.95rem;
            transition: border 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            ring: 2px solid #eff6ff;
        }

        .card {
            background: var(--bg-card);
            border-radius: 0.75rem;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #f9fafb;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-light);
        }

        tr:hover {
            background: #f9fafb;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 500px;
            transform: translateY(20px);
            transition: transform 0.2s;
        }

        .modal-overlay.open .modal {
            transform: translateY(0);
        }

        .hidden {
            display: none !important;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            padding: 1.5rem;
            background: var(--bg-card);
            border-radius: 0.75rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-top: 0.5rem;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-light);
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div id="login-view">
        <div class="login-card">
            <h2>🏥 Clinic Portal</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-control" value="sec">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" value="123">
            </div>
            <button class="btn" style="width: 100%; justify-content: center;" onclick="login()">Sign In</button>
            <p id="login-msg" style="color:red; margin-top:1rem; text-align:center; font-size:0.9rem;"></p>
        </div>
    </div>

    <!-- APP LAYOUT -->
    <div id="app-view" class="hidden" style="display:flex; width:100%;">
        <nav class="sidebar">
            <div class="brand">🏥 DocRight</div>
            <div class="nav-item active" onclick="switchView('dashboard')">Dashboard</div>
            <div class="nav-item" onclick="switchView('patients')">Patients</div>
            <div class="nav-item" onclick="switchView('appointments')">Appointments</div>
            <div class="user-info">
                Logged in as <span id="user-name-display" style="font-weight:600; color:var(--text-main)">...</span>
                <br>
                <a href="#" onclick="logout()"
                    style="color:var(--danger); text-decoration:none; margin-top:0.5rem; display:inline-block;">Sign
                    Out</a>
            </div>
        </nav>

        <main class="main-content">

            <!-- DASHBOARD -->
            <div id="view-dashboard">
                <div class="header">
                    <h1 class="page-title">Dashboard</h1>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Patients</div>
                        <div class="stat-value" id="stats-patients">-</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Upcoming Appointments</div>
                        <div class="stat-value" id="stats-appointments">-</div>
                    </div>
                </div>
            </div>

            <!-- PATIENTS -->
            <div id="view-patients" class="hidden">
                <div class="header">
                    <h1 class="page-title">Patients</h1>
                    <button class="btn" onclick="openAddPatientModal()">+ New Patient</button>
                </div>
                <div class="card">
                    <table id="patients-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Age</th>
                                <th>Condition</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- APPOINTMENTS -->
            <div id="view-appointments" class="hidden">
                <div class="header">
                    <h1 class="page-title">Appointments</h1>
                </div>
                <div class="card">
                    <table id="appointments-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Patient</th>
                                <th>Title</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- MODAL: ADD PATIENT -->
    <div class="modal-overlay" id="modal-add-patient">
        <div class="modal">
            <h3 style="margin-bottom:1.5rem;">New Patient</h3>
            <div class="form-group" style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
                <div>
                    <label>First Name*</label>
                    <input type="text" id="p-first" class="form-control">
                </div>
                <div>
                    <label>Last Name*</label>
                    <input type="text" id="p-last" class="form-control">
                </div>
            </div>
            <div class="form-group" style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
                <div>
                    <label>Age*</label>
                    <input type="number" id="p-age" class="form-control">
                </div>
                <div>
                    <label>Gender</label>
                    <select id="p-gender" class="form-control">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Contact</label>
                <input type="text" id="p-contact" class="form-control">
            </div>
            <div class="form-group">
                <label>Medical History</label>
                <textarea id="p-history" class="form-control" rows="3"></textarea>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:2rem;">
                <button class="btn secondary" onclick="closeModal()">Cancel</button>
                <button class="btn" onclick="submitNewPatient()">Create Patient</button>
            </div>
        </div>
    </div>

    <script>
        // If accessed via file://, default to localhost. Otherwise use the server's origin (e.g. http://192.168.x.x:3000)
        const API_URL = window.location.origin.startsWith('http') ? window.location.origin : 'http://localhost:3000';
        let TOKEN = null;

        // --- AUTH ---
        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();

                if (res.ok) {
                    TOKEN = data.token;
                    document.getElementById('user-name-display').innerText = data.name;
                    document.getElementById('login-view').classList.add('hidden');
                    document.getElementById('app-view').classList.remove('hidden');
                    loadData();
                } else {
                    document.getElementById('login-msg').innerText = data.error;
                }
            } catch (err) {
                alert("Server Connection Failed");
            }
        }

        function logout() {
            TOKEN = null;
            location.reload();
        }

        // --- NAVIGATION ---
        function switchView(viewName) {
            // Update Sidebar
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');

            // Hide all views
            ['dashboard', 'patients', 'appointments'].forEach(v => {
                document.getElementById(`view-${v}`).classList.add('hidden');
            });

            // Show selected
            document.getElementById(`view-${viewName}`).classList.remove('hidden');
        }

        // --- DATA LOADING ---
        async function loadData() {
            await Promise.all([fetchPatients(), fetchAppointments()]);
            updateDashboard();
        }

        let patientsList = [];
        let appointmentsList = [];

        async function fetchPatients() {
            try {
                const res = await fetch(`${API_URL}/patients`, { headers: { 'Authorization': TOKEN } });
                patientsList = await res.json();
                renderPatients();
            } catch (e) { console.error(e); }
        }

        async function fetchAppointments() {
            try {
                const res = await fetch(`${API_URL}/appointments`, { headers: { 'Authorization': TOKEN } });
                appointmentsList = await res.json();
                renderAppointments();
            } catch (e) { console.error(e); }
        }

        function renderPatients() {
            const tbody = document.querySelector('#patients-table tbody');
            tbody.innerHTML = patientsList.map(p => `
                <tr>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.age}</td>
                    <td><span style="font-size:0.9em; background:#f3f4f6; padding:0.2rem 0.6rem; border-radius:1rem;">${p.condition}</span></td>
                    <td><button class="btn secondary" style="padding:0.3rem 0.6rem; font-size:0.8rem">Edit</button></td>
                </tr>
            `).join('');
            document.getElementById('stats-patients').innerText = patientsList.length;
        }

        function renderAppointments() {
            const tbody = document.querySelector('#appointments-table tbody');
            tbody.innerHTML = appointmentsList.map(a => `
                <tr>
                    <td>${new Date(a.date).toLocaleDateString()}</td>
                    <td><strong>${a.patientName}</strong></td>
                    <td>${a.title}</td>
                    <td><span style="color:${a.status === 'scheduled' ? 'orange' : 'green'}">${a.status}</span></td>
                </tr>
            `).join('');
            document.getElementById('stats-appointments').innerText = appointmentsList.length;
        }

        function updateDashboard() {
            // Stats updated in render functions
        }

        // --- ADD PATIENT ---
        function openAddPatientModal() {
            document.getElementById('modal-add-patient').classList.add('open');
        }
        function closeModal() {
            document.getElementById('modal-add-patient').classList.remove('open');
        }

        async function submitNewPatient() {
            const payload = {
                first_name: document.getElementById('p-first').value,
                last_name: document.getElementById('p-last').value,
                age: document.getElementById('p-age').value,
                gender: document.getElementById('p-gender').value,
                contact: document.getElementById('p-contact').value,
                medical_history: document.getElementById('p-history').value
            };

            if (!payload.first_name || !payload.last_name || !payload.age) {
                alert("Please fill required fields");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/patients`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': TOKEN },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeModal();
                    // Clear form
                    document.querySelectorAll('#modal-add-patient input').forEach(i => i.value = '');
                    fetchPatients(); // Refresh list
                } else {
                    alert("Failed to create patient");
                }
            } catch (e) {
                alert("Error creating patient");
            }
        }

    </script>
</body>

</html>
